name = "finishart"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# Old Wix paths are redirected in src/worker.js. The Worker does not rewrite hostnames.
# www.finishart.bg → https://finishart.bg belongs in a Cloudflare Redirect Rule.
# This file does not attach a production route and must not be used to change DNS.

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[vars]
CONTACT_TO = "office@finishart.bg"
